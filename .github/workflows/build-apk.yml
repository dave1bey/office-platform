name: Build Android APK (Zero Cost)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies & Build Web Assets
        run: |
          cd frontend
          npm install
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd frontend
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk office-platform.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: office-platform-apk
          path: office-platform.apk
          retention-days: 30

