version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: attendance_postgres
    restart: always
    environment:
      POSTGRES_DB: attendance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      LANG: en_US.utf8
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed-data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql
    networks:
      - office-lan

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendance_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/attendance_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      JWT_SECRET: c2VjdXJlX29mZmljZV9hdHRlbmRhbmNlX3BsYXRmb3JtX3NlY3JldF9rZXlfZm9yX2p3dF8yMDI2
    depends_on:
      - postgres
    networks:
      - office-lan

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attendance_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - office-lan

volumes:
  pgdata:

networks:
  office-lan:
    driver: bridge

